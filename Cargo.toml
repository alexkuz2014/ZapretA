[workspace]
members = [
    "crates/core",
    "crates/engine",
    "crates/net",
    "crates/probe",
    "crates/app",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
