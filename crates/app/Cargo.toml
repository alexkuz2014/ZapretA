[package]
name = "zapreta"
version = "0.3.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
zapreta-core = { version = "0.1.0", path = "../core" }
zapreta-engine = { version = "0.1.0", path = "../engine" }
zapreta-net = { version = "0.1.0", path = "../net" }
zapreta-probe = { version = "0.1.0", path = "../probe" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

sha2 = "0.10"
serde_json = "1"
serde.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.26"
raw-window-handle = "0.6"

[features]
# Developer build: records detailed logs of every probe, strategy and engine
# run to %LOCALAPPDATA%\ZapretA\devlogs (see docs/DEV_LOGS.md).
devlog = []

[[bin]]
name = "zapreta"
path = "src/main.rs"
